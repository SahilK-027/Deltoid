<style>
/* Layout: one phone-width column, masthead band, sections on the page background, bottom nav. Tokens are Deltoid's own (lib/core/theme/tokens.dart). */
:root {

  --cyan:#77D4E3; --pink:#FF7F9F; --sand:#CBA27B; --red:#F83446;

  --bulk:#B28DF7; --cut:#77D4E3; --maint:var(--text2);

  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#F4F4F4; --sunken:#E8E8E8; --surface:#FFFFFF; --high:#EDEDED; --highest:#E0E0E0;
  --border:#E4E4E4; --border-strong:#C4C4C4; --text:#111111; --text2:#5F5F5F; --text3:#8C8C8C;
  --accent:#111111; --on-accent:#FFFFFF; --heat-empty:#E0E0E0; --deload-muted:#FBE4D6; --scrim:rgba(0,0,0,.35);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg:#F4F4F4; --sunken:#E8E8E8; --surface:#FFFFFF; --high:#EDEDED; --highest:#E0E0E0;
  --border:#E4E4E4; --border-strong:#C4C4C4; --text:#111111; --text2:#5F5F5F; --text3:#8C8C8C;
  --accent:#111111; --on-accent:#FFFFFF; --heat-empty:#E0E0E0; --deload-muted:#FBE4D6; --scrim:rgba(0,0,0,.35);
  color-scheme: light; }
html, body { height:100%; }
body { display:flex; flex-direction:column; }
.controls { flex:none; width:100%; max-width:420px; margin:0 auto; padding:6px 0 8px; background:var(--sunken); }
.controls .reviewbar { background:transparent; padding:4px 16px; }
body { background:var(--sunken); color:var(--text); font-family:var(--font); margin:0; -webkit-font-smoothing:antialiased; }

button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

/* Appearance, as in Settings today */

.sw { width:46px; height:28px; border-radius:999px; background:var(--highest); position:relative; flex:none; }

.scrim { position:absolute; inset:0; background:var(--scrim); display:flex; align-items:flex-end; z-index:10; }
.sheet { background:var(--surface); width:100%; border-radius:24px 24px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px)); max-height:80%; overflow-y:auto; }
.sheet h3 { font-size:20px; line-height:26px; font-weight:700; margin-bottom:4px; }
.sheet .stack { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
.field { height:64px; border-radius:14px; background:var(--high); display:flex; align-items:center; padding:0 16px; gap:8px; }
.field input { flex:1; min-width:0; background:none; border:0; color:var(--text); font:700 22px var(--font); font-variant-numeric:tabular-nums; outline:none; }

/* Today's components */
.band { background:var(--surface) !important; }
.total { text-align:right; }
.total .v { font-size:22px; line-height:26px; font-weight:700; font-variant-numeric:tabular-nums; }
.segp { height:40px; padding:3px; border-radius:999px; background:var(--high); display:grid; grid-template-columns:repeat(2,1fr); margin-top:12px; }

.fchips { display:flex; gap:8px; padding:12px 16px; overflow-x:auto; }

.wdiv { height:1px; background:var(--border); margin-left:72px; }
.vrow { display:grid; grid-template-columns:96px 1fr 64px; align-items:center; gap:8px; min-height:30px; font-size:14px; color:var(--text2); }

<script>
(function(){
const $ = (s, r=document) => r.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem('deltoid-proto5-'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('deltoid-proto5-'+k, JSON.stringify(v)); } catch(e){} }
};
const TODAY = new Date(2026, 9, 15);
const dayKey = d => d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);

/* Example data: a deterministic training and weigh-in history from March 2025 */
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }
const START = new Date(2025, 2, 3);
const trained = new Map(), weighed = new Set();
(function seed(){
  const r = rng(7); let d = START, i = 0;
  while (d <= TODAY) {
    const dow = (d.getDay()+6)%7;
    const wk = Math.floor(i/7);
    const holiday = (wk>=21 && wk<=22) || (wk>=42 && wk<=43);
    if (!holiday && [0,1,3,5].includes(dow) && r() > .12) trained.set(dayKey(d), wk % 7 === 6 ? 'deload' : 'trained');
    if (!holiday && r() > (wk < 40 ? .62 : .38)) weighed.add(dayKey(d));
    d = addDays(d, 1); i++;
  }
  trained.delete(dayKey(TODAY)); trained.delete(dayKey(addDays(TODAY,-1)));
})();
const extraWeigh = store.get('weighToday', false);
if (extraWeigh) weighed.add(dayKey(TODAY));

const regimes = [
  { name:'Upper lower', hue:'var(--pink)', days:4, note:'Cycle 4', active:true },
  { name:'Push pull legs', hue:'var(--cyan)', days:6, note:'Last trained 12 Aug' },
  { name:'Strength block', hue:'var(--yellow)', days:3, note:'Never trained' }
];
const session = { name:'Upper 1', regime:'Upper lower', cycle:4, total:4, done:2, deloadNext:true,
  ex:[['Bench press','Chest','4 × 6–8'],['Barbell row','Back','4 × 8–10'],['Incline dumbbell press','Chest','3 × 8–12'],['Lat pulldown','Back','3 × 10–12'],['Lateral raise','Shoulders','3 × 12–15'],['Triceps pushdown','Triceps','3 sets']] };
let weight = store.get('weight', 78.2);
let phase = store.get('phase', { kind:'Cut', since:'2026-09-03', startWeight:81.9, length:12 });

const CARDS = {
  session:{ name:"Today's session", fixed:true },
  habits:{ name:'Habits' },
  phase:{ name:'Phase' },
  past:{ name:'Past sessions' }
};
let layout = store.get('layout', [['session',true],['habits',true],['phase',true],['past',true]]);
let themeChoice = store.get('theme', 'system');
applyTheme();

const tabs = [['home','Home','home'],['regimes','Regimes','dashboard'],['progress','Progress','monitoring'],['history','History','history'],['more','More','pending']];
let current = store.get('tab','home');
let pushed = null;

function applyTheme(){ const r=document.documentElement; if(themeChoice==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', themeChoice); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso, year){ const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MON[d.getMonth()]+(year?' '+d.getFullYear():''); }
function weeksSince(iso){ return Math.floor((TODAY - new Date(iso+'T00:00:00'))/604800000) + 1; }
function backup(){ return `<button class="circ same" aria-label="Backed up" data-toast="Backed up. Everything is saved on this phone and on your account."><span class="ms" style="color:var(--green)">cloud_done</span></button>`; }
function iconTile(icon, colour, size=40){ return `<span class="icontile" style="width:${size}px;height:${size}px;background:color-mix(in srgb, ${colour} 16%, transparent)"><span class="ms" style="font-size:${size/2}px;color:${colour}">${icon}</span></span>`; }
function last30(set, colourFor){ let h=''; for(let i=29;i>=0;i--){ const k=dayKey(addDays(TODAY,-i)); const c=colourFor(set, k); h += `<i style="${c?'background:'+c:''}"></i>`; } return h; }
function weekCount(test){ const dow=(TODAY.getDay()+6)%7; let n=0; for(let i=0;i<=dow;i++) if(test(dayKey(addDays(TODAY,-i)))) n++; return n; }

function phaseCard(){
  if(!phase.kind) return `<section class="sec"><div class="sh"><h2>Phase</h2></div><div class="card">
    <p class="value">——</p><p class="body" style="margin-top:4px">Mark a bulk, a cut or maintenance, and every chart shows it from the day it starts.</p>
    <button class="secondary" style="margin-top:16px" id="phase-edit">Set a phase</button></div></section>`;
  const icon = { Bulk:'trending_up', Cut:'trending_down', Maintenance:'trending_flat' }[phase.kind];
  const change = weight - phase.startWeight, weeks = weeksSince(phase.since);
  const rate = change / Math.max(1, weeks-1);
  const sign = v => (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(1);
  return `<section class="sec"><div class="sh"><h2>Phase</h2><button class="link" id="phase-edit">Change<span class="ms">chevron_right</span></button></div>

function phaseBand(kind){ return kind==='Bulk' ? 'color-mix(in srgb, var(--bulk) 20%, transparent)' : kind==='Cut' ? 'color-mix(in srgb, var(--cut) 20%, transparent)' : kind==='Maintenance' ? 'color-mix(in srgb, var(--maint) 16%, transparent)' : 'transparent'; }
const PHASE_SWATCH = { Bulk:'var(--bulk)', Cut:'var(--cut)', Maintenance:'var(--maint)' };
function phaseLegend(kinds){ return [...new Set(kinds)].filter(Boolean).map(k=>`<span><i style="background:${PHASE_SWATCH[k]}"></i>${k}</span>`).join(''); }
function phaseSpark(){
  const w = [80.4,81.0,81.5,81.9,81.6,81.0,80.7,80.1,79.6,79.1,78.6,weight], since=3, W=340, H=72, L=4, R=4, T=8, B=8;
  const lo=Math.min(...w)-0.5, hi=Math.max(...w)+0.5, x=i=>L+i*(W-L-R)/(w.length-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const pts = w.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const cutX = (x(since-1)+x(since))/2;
  const bands = `<rect x="0" y="0" width="${cutX}" height="${H}" rx="6" style="fill:${phaseBand('Bulk')}"/><rect x="${cutX}" y="0" width="${W-cutX}" height="${H}" rx="6" style="fill:${phaseBand(phase.kind||'Cut')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bodyweight over 12 weeks: a bulk, then the current ${(phase.kind||'cut').toLowerCase()} from ${w[since]} to ${weight.toFixed(1)} kg">${bands}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(w.length-1)}" cy="${y(weight)}" r="4" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/></svg>

}

/* ---------- Full year maps (pushed) ---------- */
/* Today's YearHeatmap: Jan to Dec, no weekday column, months centred under their own columns, a tapped day replaces the month strip */
function yearMap(year, colourFor, kind){
  const jan1 = new Date(year,0,1), start = addDays(jan1, -((jan1.getDay()+6)%7));
  const dec31 = new Date(year,11,31), end = addDays(dec31, 6-((dec31.getDay()+6)%7));
  const weeks = Math.round((end - start)/86400000 + 1) / 7;
  const W = 336, unit = W/weeks, gap = Math.min(3, Math.max(1, unit*.2)), cell = Math.min(14, Math.max(2, unit-gap)), r = cell < 6 ? 1.2 : 3;
  const gridH = 7*cell + 6*gap, top = gridH + gap;
  let rects = '', spans = {};
  for(let w=0; w<weeks; w++) for(let d=0; d<7; d++){
    const date = addDays(start, w*7+d); if(date.getFullYear()!==year) continue;
    const k = dayKey(date), x = w*(cell+gap), y = d*(cell+gap);
    const fill = date > TODAY ? 'var(--heat-empty)" fill-opacity=".4' : (colourFor(k) || 'var(--heat-empty)');
    rects += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" rx="${r}" fill="${fill}" data-day="${k}"/>`;
    const m = date.getMonth(); spans[m] = spans[m] ? [spans[m][0], Math.max(spans[m][1], x+cell)] : [x, x+cell];
  }
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months = Object.entries(spans).map(([m,[a,b]]) => `<text x="${((a+b)/2).toFixed(1)}" y="${top+11}" font-size="10" font-weight="600" fill="var(--text2)" text-anchor="middle">${names[m]}</text>`).join('');
  return `<svg class="year" data-kind="${kind}" viewBox="0 0 ${W} ${(gridH+18).toFixed(1)}" width="100%" role="img" aria-label="${year}, one cell per day">${rects}<g class="months">${months}</g><text class="cap" x="0" y="${top+11}" font-size="11" font-weight="600" fill="var(--text)"></text><rect class="ring" width="${(cell+2).toFixed(2)}" height="${(cell+2).toFixed(2)}" rx="${r}" fill="none" stroke="var(--text)" stroke-width="1" visibility="hidden"/></svg>`;
}
function trendChart(){
  const w=[80.1,80.4,80.9,81.3,81.6,81.9,81.4,80.8,80.1,79.5,79.0,78.6,weight], W=340, H=190, L=4, R=44, T=10, B=24;
  const lo=78, hi=82.5, step=(W-L-R)/(w.length), x=i=>L+step/2+i*step, y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g=''; [78,79.5,81,82.5].forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-dasharray="4 4"/><text x="${W-R+8}" y="${y(t)+4}" font-size="11" fill="var(--text2)">${t.toFixed(1)}</text>`; });
  let xl=''; for(let k=0;k<7;k++){ const d=addDays(TODAY,-(6-k)*15); const px=L+step/2+((90-(6-k)*15)/90)*(W-L-R-step); xl+=`<text x="${px}" y="${H-6}" font-size="11" fill="var(--text2)" text-anchor="middle">${d.getDate()} ${MON[d.getMonth()]}</text>`; }
  const pts = w.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const dots = w.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" style="fill:var(--surface)" stroke="var(--blue)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bodyweight by week over three months, now ${weight.toFixed(1)} kg">${g}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function bodyweightTrend(){
  const change = weight - 80.1, sign = (change>0?'+':change<0?'−':'') + Math.abs(change).toFixed(1);
  return `<section class="sec same" style="margin-top:16px"><div class="sh"><h2>Trend</h2></div><div class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><span><span class="value">${weight.toFixed(1)}</span><span class="unit">kg</span></span><span style="font-size:13px;color:var(--text2)">${sign} kg over the range</span></div>

  </div></section>`;
}
function mapScreen(kind){
  const isW = kind==='weighins';
  const count = y => { let n=0; const src = isW ? [...weighed] : [...trained.keys()]; src.forEach(k=>{ if(Math.floor(k/10000)===y) n++; }); return n; };
  const total = count(2025)+count(2026);
  const noun = isW ? 'weigh-in' : 'session';
  const colourFor = isW ? k => weighColour(weighed,k) : k => trainColour(trained,k);
  const sw = (c,l) => `<span><i style="background:${c}"></i>${l}</span>`;
  const legend = isW ? sw('var(--heat-empty)','No weigh-in')+sw('var(--lavender)','Weighed') : sw('var(--heat-empty)','Rest')+sw('var(--blue)','Trained')+sw('var(--orange)','Deload');
  return `<header class="appbar"><button data-back aria-label="Back"><span class="ms">arrow_back</span></button><h1>${isW?'Weigh-ins':'Consistency'}</h1>${isW ? `<div class="bar-actions"><button class="circ" aria-label="Log or correct a past weigh-in" data-toast="Opens the day picker: a weighed day opens its weigh-in to correct, any other day logs one."><span class="ms">edit_calendar</span></button><button class="circ" id="log-weight" aria-label="Log weight"><span class="ms">add</span></button></div>` : '<span></span>'}</header>
    ${isW ? bodyweightTrend() : ''}
    <div style="padding:${isW?28:16}px 16px 0"><p class="t16">${total} ${noun}s since March 2025</p><div class="legend" style="margin-top:12px">${legend}</div></div>
    ${[2026,2025].map(y=>`<section class="sec"><div class="sh"><h2>${y}</h2><span class="body">${count(y)} ${noun}${count(y)===1?'':'s'}</span></div>
      <div class="card" style="padding:12px 12px 8px">${yearMap(y, colourFor, kind)}</div></section>`).join('')}
`;
}
function pickDay(rect){
  const svg = rect.closest('svg'), k = +rect.dataset.day, ring = svg.querySelector('.ring'), cap = svg.querySelector('.cap'), months = svg.querySelector('.months');
  if(svg.dataset.picked == k){ svg.dataset.picked=''; ring.setAttribute('visibility','hidden'); cap.textContent=''; months.removeAttribute('visibility'); return; }
  svg.dataset.picked = k;
  ring.setAttribute('x', +rect.getAttribute('x')-1); ring.setAttribute('y', +rect.getAttribute('y')-1); ring.setAttribute('visibility','visible');
  const d = new Date(Math.floor(k/10000), Math.floor(k/100)%100-1, k%100);
  const stamp = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
  let text;
  if(svg.dataset.kind==='weighins') text = stamp + (weighed.has(k) ? ' · weighed' : ' · no weigh-in');
  else { const t = trained.get(k); text = stamp + (t ? ' · 1 session' + (t==='deload' ? ' · deload' : '') : ' · rest day'); }
  if(d > TODAY) text = stamp;
  cap.textContent = text; months.setAttribute('visibility','hidden');
}

function volumeCard(){

}
function cycleChart(){
  /* As today's CycleAxisChart: a deload is a band 80% of its slot at 14% orange, with no point and an orange cycle number; the line jumps it dashed at 60%. Phase bands fill the other slots and meet the deload band's edges. */
  const vals = [0,1.8,3.1,null,5.2,6.4], phases = ['Maintenance','Bulk','Bulk','Cut','Cut','Cut'], W=340, H=150, L=8, R=36, T=12, B=26;
  const lo=-1, hi=7, n=vals.length, x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo), half=(x(1)-x(0))/2;
  const isDeload = i => vals[i] === null;
  let bands='';
  for(let i=0;i<n;i++){ if(isDeload(i)) continue;
    let a = i>0 && isDeload(i-1) ? x(i-1)+0.8*half : x(i)-half, b = i<n-1 && isDeload(i+1) ? x(i+1)-0.8*half : x(i)+half;
    a=Math.max(L,a); b=Math.min(W-R,b);
    bands += `<rect x="${a}" y="${T}" width="${b-a}" height="${H-T-B}" style="fill:${phaseBand(phases[i])}"/>`; }
  const deload = vals.map((v,i)=> isDeload(i) ? `<rect x="${x(i)-0.8*half}" y="${T}" width="${1.6*half}" height="${H-T-B}" style="fill:color-mix(in srgb, var(--orange) 14%, transparent)"/>` : '').join('');
  let g=''; [0,3,6].forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${W-R+8}" y="${y(t)+4}" font-size="11" fill="var(--text2)">${t>0?'+':''}${t}%</text>`; });
  let line='';
  const idx = vals.map((v,i)=>i).filter(i=>!isDeload(i));
  for(let k=1;k<idx.length;k++){ const p=idx[k-1], q=idx[k], jump=q-p>1;
    line += `<line x1="${x(p)}" y1="${y(vals[p])}" x2="${x(q)}" y2="${y(vals[q])}" stroke="var(--blue)" stroke-width="2" ${jump?'stroke-dasharray="4 4" stroke-opacity=".6"':''} stroke-linecap="round"/>`; }
  const labels = vals.map((v,i)=>`<text x="${x(i)}" y="${H-6}" font-size="11" text-anchor="middle" style="fill:var(${isDeload(i)?'--orange':i===n-1?'--text':'--text2'})">${i+1}</text>`).join('');
  const dots = idx.map(i=> i===n-1 ? `<circle cx="${x(i)}" cy="${y(vals[i])}" r="5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>` : `<circle cx="${x(i)}" cy="${y(vals[i])}" r="3" style="fill:var(--surface)" stroke="var(--blue)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Strength change by cycle, rising to 6.4 percent at cycle 6, with a deload at cycle 4. Cycle 1 ran at maintenance, 2 and 3 during a bulk, and 5 and 6 during a cut.">${bands}${deload}${g}${line}${dots}${labels}</svg>`;
}

    <div class="card">
      <p class="t16 same" style="color:var(--text2)">Upper lower</p>
      <p class="same" style="margin-top:8px;display:flex;align-items:center;gap:8px"><span><span class="value">+6.4</span><span class="unit">%</span></span><span class="pill" style="background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)">Progressing</span></p>
      <div class="segp three same"><button aria-pressed="true">Last 12</button><button>Last 24</button><button>All</button></div>
      <p class="readout" style="margin-top:12px"><b>Cycle 6</b>  ·  Cut  ·  +6.4% on cycle 1</p>
      <div style="margin-top:8px">${cycleChart()}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--blue);border-radius:50%"></i>Cycle</span><span><i style="background:var(--orange)"></i>Deload</span>${phaseLegend(['Maintenance','Bulk','Cut'])}</div>
      <div class="hair" style="margin:12px 0"></div>
      <button class="same" style="display:flex;align-items:center;gap:4px;width:100%;text-align:left" data-toast="Opens every lift the regime has scored."><span class="valsm">25 of 37</span><span class="body" style="flex:1">lifts improved</span><span class="ms" style="font-size:20px;color:var(--text2)">chevron_right</span></button>
    </div></section>`;
}
function consistencyGrid(){
  const startMon = addDays(TODAY, -((TODAY.getDay()+6)%7) - 17*7);
  let cols='', lastLabel=-9;
  for(let w=0; w<18; w++){
    let label='';
    for(let i=0;i<7;i++){ const d=addDays(startMon,w*7+i); if(d.getDate()===1 && w-lastLabel>=2){ label=MON[d.getMonth()]; lastLabel=w; } }
    cols += `<b>${label}</b>`;
    for(let i=0;i<7;i++){ const d=addDays(startMon,w*7+i); if(d>TODAY){ cols+='<i class="future"></i>'; continue; } const c=trainColour(trained,dayKey(d)); cols+=`<i style="${c?'background:'+c:''}"></i>`; }
  }
  return `<div class="hm"><div class="wd"><span></span>${['M','','W','','F','','S'].map(l=>`<span>${l}</span>`).join('')}</div><div class="wk">${cols}</div></div>`;
}
function consistencyCard(){
  return `<section class="sec"><div class="sh"><h2>Consistency</h2><button class="link" data-push="consistency">All time<span class="ms">chevron_right</span></button></div>
    <button class="card" data-push="consistency" style="width:100%;text-align:left">
      <p class="body">Last 126 days</p>
      <div style="margin-top:16px">${consistencyGrid()}</div>
      <div class="hair" style="margin:16px 0 12px"></div>
      <p><span class="valsm">${weekCount(k=>trained.has(k))}/7</span><span class="unit">this week</span><span class="body" style="margin:0 8px">·</span><span class="valsm">3</span><span class="unit">avg/wk</span></p>
    </button></section>`;
}
function weightChart(){
  const w=[80.4,80.9,81.3,81.6,81.9,82.0,81.4,80.8,80.1,79.5,79.0,78.6,weight], W=340, H=140, L=8, R=40, T=10, B=12;
  const lo=77.5, hi=82.5, x=i=>L+i*(W-L-R)/(w.length-1), y=v=>T+(hi-Math.min(hi,Math.max(lo,v)))*(H-T-B)/(hi-lo);
  let g=''; [78,80,82].forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${W-R+8}" y="${y(t)+4}" font-size="11" fill="var(--text2)">${t} kg</text>`; });
  const pts = w.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bodyweight over 13 weeks, now ${weight.toFixed(1)} kg">${g}<polyline points="${pts}" fill="none" stroke="var(--lavender)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(w.length-1)}" cy="${y(weight)}" r="5" fill="var(--lavender)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function bodyweightCard(){
  return `<section class="sec"><div class="sh"><h2>Bodyweight</h2><button class="link" data-push="weighins">History<span class="ms">chevron_right</span></button></div><div class="card">
    <p class="body">Last 13 weeks</p><p style="margin:4px 0 12px"><span class="value">${weight.toFixed(1)}</span><span class="unit">kg</span></p>${weightChart()}</div></section>`;
}
function progressScreen(){
  return `<header class="band"><div><p class="eyebrow">Cycles and volume</p><h1 class="title">Progress</h1></div><div class="actions">${backup()}</div></header>
    ${strengthCard()}${volumeCard()}`;
}

/* ---------- History, as today ---------- */
function historyScreen(){
  const months = [['October 2026',[['Lower 2','Mon 13','16 sets · 58 min','Squat · Romanian deadlift · Leg press · Calf raise'],['Upper 2','Sat 11','18 sets · 66 min','Overhead press · Pull-up · Dip · Cable row'],['Upper 1','Thu 9','17 sets · 62 min','Bench press · Barbell row · Incline dumbbell press · Lat pulldown'],['Lower 1','Tue 7','15 sets · 54 min','Deadlift · Front squat · Leg curl · Calf raise']]],
                  ['September 2026',[['Upper 2','Tue 30','14 sets · 48 min','Overhead press · Pull-up · Dip · Cable row',1],['Lower 1','Sun 28','11 sets · 41 min','Deadlift · Front squat · Leg curl · Calf raise',1]]]];
  return `<header class="band" style="flex-direction:column;align-items:stretch"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
      <div><p class="eyebrow">Since March 2025</p><h1 class="title">History</h1></div>
      <div class="actions" style="align-items:flex-end">${backup()}<div class="total"><p class="v">${trained.size}</p><p class="micro">sessions</p></div></div></div>
      <div class="segp"><button aria-pressed="true">Sessions</button><button data-toast="Shows every exercise trained, each opening its own trend.">Exercises</button></div></header>
    <div class="fchips"><span class="achip"><span class="ms">calendar_view_week</span>All days<span class="ms">keyboard_arrow_down</span></span><span class="achip"><span class="ms">trending_down</span>Deloads</span></div>
    ${months.map(([m,rows],mi) => `<section class="sec" style="margin-top:${mi?28:4}px"><div class="sh"><h2>${m}</h2><span class="body">${rows.length}</span></div></section>
      ${rows.map(([n,d,meta,ex,del],i) => `${i?'<div class="wdiv"></div>':''}<button class="wrow" data-toast="Opens ${n} on ${d}.">
        ${iconTile(del?'trending_down':'bolt', del?'var(--orange)':'var(--blue)', 44)}
        <span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:8px"><span class="t16 ell">${n}</span>${del?'<span class="pill" style="background:color-mix(in srgb, var(--orange) 14%, transparent);color:var(--orange)">Deload</span>':''}</span>
        <span class="body ell" style="display:block;margin-top:2px">${d} · ${meta}</span><span class="ell" style="display:block;margin-top:2px;font-size:13px;color:var(--text3)">${ex}</span></span>
        <span class="ms" style="font-size:20px;color:var(--text3);margin-top:12px">chevron_right</span></button>`).join('')}`).join('')}`;
}

/* ---------- More: today's Settings without bodyweight ---------- */
function mini(p){ return `<div style="position:absolute;inset:0;background:${p.bg};padding:8px;display:flex;flex-direction:column;gap:4px">
  <span style="color:${p.text};font:800 15px/1 var(--font)">Aa</span>
  <span style="display:flex;gap:4px">${['#FF7F9F','#77D4E3','#B28DF7','#5DBA86'].map(c=>`<i style="width:8px;height:8px;border-radius:50%;background:${c}"></i>`).join('')}</span>
  <i style="height:12px;border-radius:3px;background:${p.high};margin-top:4px"></i>
  <span style="display:flex;gap:4px"><i style="flex:1;height:10px;border-radius:3px;background:${p.high}"></i><i style="flex:1;height:10px;border-radius:3px;background:${p.high}"></i></span></div>`; }
function themePicker(){
  const dark={bg:'#131313',text:'#FFFFFF',high:'#2B2B2B'}, light={bg:'#F4F4F4',text:'#111111',high:'#EDEDED'};
  const tile=(k,label,inner)=>`<button aria-pressed="${themeChoice===k}" data-theme-pick="${k}"><span class="mount"><span class="mini" style="display:block">${inner}</span></span><span class="lbl">${label}</span></button>`;
  return `<div class="themes">${tile('system','System', mini(dark)+`<div style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,0 100%)">${mini(light)}</div>`)}${tile('light','Light',mini(light))}${tile('dark','Dark',mini(dark))}</div>`;
}
function moreScreen(){
  const r = (icon, t, s, trail, fresh) => `<div class="row${fresh?'':' same'}" ${trail?'':`role="button" tabindex="0" data-toast="Opens ${t.toLowerCase()}."`}><span class="ms lead">${icon}</span><span class="grow"><span class="t16" style="display:block">${t}</span>${s?`<span class="body">${s}</span>`:''}</span>${trail ?? '<span class="ms chev">chevron_right</span>'}</div>`;
  const sw = (on, label) => `<button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-switch></button>`;
  return `<header class="band"><div><p class="eyebrow same">On this device</p><h1 class="title">More</h1></div><div class="actions">${backup()}</div></header>
  <div class="block" style="display:flex;align-items:center;gap:12px;padding-top:4px">
    <span style="width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;font-size:16px;font-weight:800;letter-spacing:-.2px" aria-hidden="true">AM</span>
    <span style="min-width:0"><span class="ell" style="display:block;font-size:20px;line-height:26px;font-weight:700">Alex Morgan</span><span class="body ell" style="display:block">Backed up since 31 May 2025</span></span>
  </div>
  <section class="sec" style="margin-top:16px"><div class="sh same"><h2>Account &amp; backup</h2></div><div class="rows">
    ${r('account_circle','Account','alex.morgan@example.com',undefined,true)}${r('ios_share','Export a backup file','Every workout, in one file')}${r('settings_backup_restore','Restore from a file','Replaces everything on this phone')}${r('schedule','Backup file on this phone','Last written 13 Oct 2026, 19:22','')}
  </div></section>
  <section class="sec same"><div class="sh"><h2>Training</h2></div><div class="rows">
    ${r('timer','Rest time &amp; alert','2:30 between sets and 3:00 between exercises')}${r('straighten','Weight units','Kilograms')}
    ${r('notifications','Session notification','Shows what you are training and the rest clock while a session is open.', sw(true,'Session notification'))}
    ${r('stay_current_portrait','Keep screen on','Stops the phone locking while a session is open.', sw(false,'Keep screen on'))}
  </div></section>
  <section class="sec same"><div class="sh"><h2>Appearance</h2></div>${themePicker()}</section>
  <section class="sec"><div class="sh same"><h2>About app</h2></div><div class="about"><p class="t16 same">Deltoid v1.17.0</p><p class="body" style="margin-top:8px">A training tracker that puts you in full control of your programs. Design your own routines, log every set and rep, and track your strength over time with clear, organised records.</p></div></section>`;
}

/* ---------- Sheets ---------- */
function sheet(html){ const s=document.createElement('div'); s.className='scrim'; s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click', e => { if(e.target===s) s.remove(); }); $('#app').appendChild(s); return s; }
function weighSheet(){
  const s = sheet(`<div class="same"><h3>Log weight</h3><p class="body">Thursday 15 October</p>
    <div class="stack"><label class="field" for="w-in"><input id="w-in" inputmode="decimal" value="${weight.toFixed(1)}" aria-label="Scale weight"><span class="unit">kg</span></label><p class="err" id="w-err"></p>
    <button class="primary" id="w-save">Save</button></div></div>`);
  const inp = $('#w-in', s); inp.focus(); inp.select();
  inp.addEventListener('input', () => $('#w-err', s).textContent='');
  $('#w-save', s).onclick = () => { const v = parseFloat(inp.value.replace(',','.'));
    if(!(v>=20 && v<=400)){ $('#w-err', s).textContent='Enter a weight between 20 and 400 kg.'; return; }
    weight=v; weighed.add(dayKey(TODAY)); store.set('weight',weight); store.set('weighToday',true); s.remove(); render(); toast('Weight saved.'); };
}
function phaseSheet(){
  let kind = phase.kind ?? 'Cut', len = phase.length ?? 12;
  const s = sheet(`<h3>Phase</h3><p class="body">What you are eating for. Every chart marks it from the day it starts.</p>
    <div class="stack"><div class="seg" role="group" aria-label="Phase">${['Bulk','Cut','Maintenance'].map(k=>`<button aria-pressed="${k===kind}" data-k="${k}">${k}</button>`).join('')}</div>
    <div class="inset" style="display:flex;justify-content:space-between;align-items:center"><span><span class="label" style="display:block">Started</span><span class="valsm">${phase.kind?fmtDate(phase.since,true):'15 Oct 2026'}</span></span><span class="cpill" style="background:var(--highest)">Change</span></div>
    <div class="inset" style="display:flex;justify-content:space-between;align-items:center"><span><span class="label" style="display:block">Planned length</span><span class="valsm" id="p-len">${len?len+' weeks':'Open-ended'}</span></span><button class="cpill" style="background:var(--highest)" id="p-len-btn">Change</button></div>
    ${phase.kind?'<button class="secondary" id="p-clear">Clear phase</button>':''}<button class="primary" id="p-save">Save</button></div>`);
  s.querySelectorAll('.seg button').forEach(b => b.onclick = () => { kind=b.dataset.k; s.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  const lens=[8,12,16,null]; $('#p-len-btn', s).onclick = () => { len = lens[(lens.indexOf(len)+1)%lens.length]; $('#p-len', s).textContent = len ? len+' weeks' : 'Open-ended'; };
  $('#p-save', s).onclick = () => { phase = kind===phase.kind ? {...phase, length:len} : { kind, since:'2026-10-15', startWeight:weight, length:len }; store.set('phase',phase); s.remove(); render(); toast(kind+' saved.'); };
  const clear = $('#p-clear', s); if(clear) clear.onclick = () => { phase = { kind:null }; store.set('phase',phase); s.remove(); render(); toast('Phase cleared.'); };
}
function customiseSheet(){
  const s = sheet(`<h3>Customise Home</h3><p class="body">Drag to reorder. Switch a card off to hide it from Home.</p><div id="clist" style="margin-top:16px"></div>
    <div class="stack"><button class="primary" id="c-done">Done</button></div>`);
  const list = $('#clist', s);
  const draw = () => { list.innerHTML = layout.map(([k,on],i) => `<div class="crow" data-i="${i}">
      <span class="ms grip" ${CARDS[k].fixed?'style="visibility:hidden"':`aria-label="Drag ${CARDS[k].name}"`}>drag_indicator</span>
      <span class="t16" style="flex:1">${CARDS[k].name}</span>
      ${CARDS[k].fixed?'<span class="fixed">Always first</span>':`<button class="sw" role="switch" aria-checked="${on}" aria-label="Show ${CARDS[k].name}" data-t="${i}"></button>`}</div>`).join('');
    list.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const i=+b.dataset.t; layout[i][1]=!layout[i][1]; draw(); });
    list.querySelectorAll('.grip').forEach(g => g.onpointerdown = e => startDrag(e, g.closest('.crow')));
  };
  function startDrag(e, row){
    const i0 = +row.dataset.i; if(CARDS[layout[i0][0]].fixed) return;
    e.preventDefault(); row.classList.add('dragging'); const y0=e.clientY; let idx=i0; const h=row.offsetHeight;
    const move = ev => { const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`; idx = Math.max(1, Math.min(layout.length-1, i0+Math.round(dy/h))); };
    const up = () => { document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      const [it] = layout.splice(i0,1); layout.splice(idx,0,it); draw(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  }
  draw();
  $('#c-done', s).onclick = () => { store.set('layout',layout); s.remove(); render(); };
}
let tt; function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; if(pushed) t.style.bottom='16px'; $('#app').appendChild(t); clearTimeout(tt); tt=setTimeout(()=>t.remove(),2400); }

/* ---------- Render ---------- */
const screens = { home, regimes:regimesScreen, progress:progressScreen, history:historyScreen, more:moreScreen };
function render(){
  const unchanged = pushed ? pushed==='consistency' : (current==='regimes' || current==='history');
  $('#screens').innerHTML = `<div class="screen${unchanged?' same':''}">${pushed ? mapScreen(pushed) : screens[current]()}</div>`;
  const nav = $('#nav'); nav.hidden = !!pushed;
  nav.innerHTML = tabs.map(([k,l,i]) => `<button ${k===current?'aria-current="page"':''} data-tab="${k}"><span class="ms">${i}</span><span class="l">${l}</span></button>`).join('');
}
document.addEventListener('click', e => {
  if(e.target.closest('#review-toggle')){ const t=$('#review-toggle'), on=t.getAttribute('aria-checked')!=='true'; t.setAttribute('aria-checked',on); $('#app').classList.toggle('review',on); return; }
  const day = e.target.closest('svg.year rect[data-day]'); if(day) return pickDay(day);
  const t = e.target.closest('[data-tab],[data-tab-go],[data-push],[data-back],[data-theme-pick],[data-toast],[data-switch],#phase-edit,#log-weight,#open-customise');
  if(!t) return;
  if(t.dataset.tab || t.dataset.tabGo){ current = t.dataset.tab || t.dataset.tabGo; pushed=null; store.set('tab',current); render(); $('#screens').scrollTop=0; return; }
  if(t.dataset.push){ pushed=t.dataset.push; render(); $('#screens').scrollTop=0; return; }
  if(t.hasAttribute('data-back')){ pushed=null; render(); return; }
  if(t.dataset.themePick){ themeChoice=t.dataset.themePick; store.set('theme',themeChoice); applyTheme(); render(); return; }
  if(t.id==='phase-edit') return phaseSheet();
  if(t.id==='log-weight') return weighSheet();
  if(t.id==='open-customise') return customiseSheet();
  if(t.hasAttribute('data-switch')){ t.setAttribute('aria-checked', t.getAttribute('aria-checked')!=='true'); return; }
  if(t.dataset.toast) toast(t.dataset.toast);
});
render();
})();
</script>
